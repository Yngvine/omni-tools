server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API and file downloads to the MeTube container
    location /api/metube/ {
        resolver 127.0.0.11 valid=30s;
        set $metube_upstream http://metube:8081;
        rewrite ^/api/metube/(.*)$ /$1 break;
        proxy_pass $metube_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}